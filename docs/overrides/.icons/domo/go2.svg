<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Unitree Go2 in side profile. Sized for 20-24 px, where detail turns to
       mush: a long torso, a head unit stepping up at the front, the lidar as
       a squat puck above it, and only the near leg pair, drawn thick with a
       single knee bend. The far pair and the individual joints were tried and
       dropped - below ~28 px they blur into the near legs. Filled shapes
       overlap so the outline fuses with no seam. -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9">
    <path d="M6.3 13.1 5.4 16.6 6.7 20.5"/>
    <path d="M14.8 13.1 15.7 16.6 14.4 20.5"/>
  </g>
  <rect x="3.4" y="9.6" width="13.2" height="3.9" rx="1.2" fill="currentColor"/>
  <rect x="15.6" y="7.3" width="5.1" height="4.2" rx="1.1" fill="currentColor"/>
  <rect x="16.5" y="5.6" width="3.3" height="1.8" rx="0.8" fill="currentColor"/>
</svg>
