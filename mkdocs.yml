site_name: DOMO
site_description: >-
  Developmental Orchestration of Motor-skill Onset — an LLM as a lifelong
  developmental supervisor for a legged robot.
site_author: DOMO project
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    logo: domo/mark
    repo: fontawesome/brands/git-alt
    annotation: material/plus-circle
  favicon: assets/favicon.svg
  palette:
    # `primary`/`accent` are set to "custom" so Material emits no built-in
    # colour rules; every value comes from docs/stylesheets/domo.css.
    # The auto entry carries scheme: domo-light so the server-rendered page
    # is already themed and nothing flashes before the palette JS runs.
    - media: "(prefers-color-scheme)"
      scheme: domo-light
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: domo-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: domo-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - announce.dismiss

# Treat every broken internal link or anchor as a build failure, so a page
# can never ship pointing at a heading that was renamed or removed.
validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

extra_css:
  - stylesheets/domo.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - glightbox:
      touchNavigation: true
      effect: fade
      zoomable: true

extra:
  generator: false
  social:
    - icon: material/robot-industrial
      link: https://github.com/
      name: Unitree Go2 · Genesis · PyTorch

nav:
