      - Control hierarchy: concepts/control-hierarchy.md
      - Skill grammar: concepts/grammar.md
      - Conventions: concepts/conventions.md
  - Guides:
      - guides/index.md
      - Running & training: guides/running.md
      - Extending DOMO: guides/extending.md
      - Troubleshooting: guides/troubleshooting.md
  - Examples:
      - examples/index.md
      - Skill demo: examples/skill-demo.md
      - Digital twin: examples/twin-demo.md
      - Click to walk: examples/interactive-nav.md
      - Locomotion (CPG-RL): examples/locomotion.md
      - Obstacle avoidance: examples/avoidance.md
      - Avoidance in a house: examples/avoid-house.md
      - LLM level designer: examples/gemini-design-nav.md
      - Waypoint navigation: examples/evaluate-nav.md
      - SLAM in an arena: examples/slam-demo.md
      - SLAM in an apartment: examples/slam-house.md
      - Voice commands: examples/voice.md
