[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domo"
version = "0.1.0"
description = "DOMO — Developmental Orchestration of Motor-skill Onset: LLM-supervised lifelong skill acquisition for legged robots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
]

[project.optional-dependencies]
# Physics backends are optional: the control/rl/utils layers are pure torch.
genesis = ["genesis-world"]
rl = ["tensorboard"]
# LLM supervisor (Eureka/DrEureka). google-genai is the light default;
# langchain/langgraph enable vLLM + OpenAI + the graph orchestration.
llm = ["google-genai"]
langchain = ["langgraph", "langchain-core", "langchain-openai"]
gemini-langchain = ["langchain-google-genai"]
voice = ["openai-whisper", "sounddevice"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["domo*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["scripts", "runs", "policies"]

[tool.ruff.lint]
# Correctness (E/F/B), import order (I), modern syntax (UP), simplifications
# (SIM) and ruff's own checks (RUF). Keep the list small and explicit so the
# baseline stays reproducible for every contributor.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length: handled by the formatter / reviewed by hand
    "RUF012",  # mutable class attributes: dataclass-free configs use them deliberately
    "SIM108",  # ternaries are not always clearer than if/else
    "B905",    # zip(strict=) churn on tensor-shaped iterables
    "RUF001", "RUF002", "RUF003",  # arrows and dashes in prose are intentional
]

[tool.ruff.lint.isort]
known-first-party = ["domo"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]   # sys.path tweaks before imports in standalone scripts
"__init__.py" = ["F401"]  # re-exports
